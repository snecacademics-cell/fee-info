<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Fees & WhatsApp System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f9f9f9; }
        .upload-container { display: flex; align-items: center; gap: 15px; background: #fff; padding: 10px 15px; border-radius: 5px; border: 1px solid #ddd; margin-bottom: 20px; }
        table { border-collapse: collapse; width: 100%; background: white; margin-top: 15px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        .btn { padding: 8px 12px; cursor: pointer; color: white; border: none; border-radius: 4px; font-size: 13px; font-weight: bold;}
        .btn-whatsapp { background: #00e676; }
        .btn-archive { background: #e57373; margin-left: 10px; }
        .btn-upload { background: #5c6bc0; }
        .controls { display: flex; margin-bottom: 15px; }

        /* പുതിയ വേഗത്തിലുള്ള കസ്റ്റം പോപ്പ്-അപ്പ് */
        .overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); z-index: 9999; justify-content: center; align-items: center;
        }
        .popup {
            background: white; padding: 30px; border-radius: 10px; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); max-width: 400px; width: 90%;
        }
        .popup h3 { margin-top: 0; color: #333; font-size: 18px; }
        .popup p { color: #555; margin-bottom: 25px; font-size: 15px; }
        .btn-next { background: #25D366; font-size: 16px; padding: 12px 25px; width: 100%; margin-bottom: 10px;}
        .btn-cancel { background: #d9534f; width: 100%; padding: 10px; margin-top: 5px;}
    </style>
</head>
<body>
    <h2>Student Fees & WhatsApp System</h2>
    
    <div class="upload-container">
        <strong style="font-size: 14px; color: #444;">Upload New Sheet:</strong>
        <input type="file" id="excelFile" accept=".xlsx, .xls, .csv">
        <button class="btn btn-upload" onclick="handleFileUpload()">Upload & Save</button>
    </div>

    <div class="controls">
        <button class="btn btn-whatsapp" onclick="startSendingMessages()">Send WhatsApp Message</button>
        <button class="btn btn-archive" onclick="archiveData()">Archive Old Data</button>
    </div>
    
    <div style="overflow-x:auto;">
        <table id="dataTable">
            <thead>
                <tr>
                    <th><input type="checkbox" id="selectAll" onclick="toggleAll()"> Select All</th>
                    <th>Student Name</th>
                    <th>Parent</th>
                    <th>Mobile (F)</th>
                    <th>Monthly</th>
                    <th>Exam</th>
                    <th>Medical</th>
                    <th>Mess</th>
                    <th>Stationary</th>
                    <th>Others</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="11" style="text-align:center; padding:20px;">Loading data...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- പോപ്പ്-അപ്പ് വിൻഡോ -->
    <div class="overlay" id="messageOverlay">
        <div class="popup">
            <h3 id="popupTitle">അടുത്ത മെസ്സേജ് തയ്യാറാണ്</h3>
            <p id="popupText">തുടരാൻ താഴെ ക്ലിക്ക് ചെയ്യുക.</p>
            <button class="btn btn-next" onclick="processQueue()">Send Next Message</button>
            <button class="btn btn-cancel" onclick="cancelSending()">Cancel</button>
        </div>
    </div>

    <script>
        const webAppUrl = 'https://script.google.com/macros/s/AKfycbymr6-kuDTjBkR_W74kTJ_IxA8oX0Drh4wdEKqStjadxYIaIGXAqFssBeMpqDC0-xp6sg/exec';
        let studentData = [];
        let messagesQueue = []; 

        async function fetchData() {
            try {
                const response = await fetch(webAppUrl);
                studentData = await response.json();
                populateTable();
            } catch (error) {
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="11" style="color:red; text-align:center;">Error loading data.</td></tr>';
            }
        }

        function populateTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            if(studentData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;">No data found.</td></tr>';
                return;
            }
            studentData.forEach((student, index) => {
                if(student['Total'] > 0) { 
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><input type="checkbox" class="student-checkbox" data-index="${index}"></td>
                        <td>${student['Name'] || ''}</td>
                        <td>${student['Father'] || ''}</td>
                        <td>${student['Mobile (F)'] || ''}</td>
                        <td>${student['Monthly Fee'] || 0}</td>
                        <td>${student['Exam Fee'] || 0}</td>
                        <td>${student['Medical'] || 0}</td>
                        <td>${student['Mess Fee'] || 0}</td>
                        <td>${student['Stationary'] || 0}</td>
                        <td>${student['Others'] || 0}</td>
                        <td><strong>₹${student['Total'] || 0}</strong></td>
                    `;
                    tbody.appendChild(tr);
                }
            });
        }

        function toggleAll() {
            const selectAll = document.getElementById('selectAll').checked;
            document.querySelectorAll('.student-checkbox').forEach(cb => cb.checked = selectAll);
        }

        function startSendingMessages() {
            messagesQueue = [];
            const checkboxes = document.querySelectorAll('.student-checkbox:checked');
            if(checkboxes.length === 0) {
                alert("ദയവായി കുട്ടികളെ തിരഞ്ഞെടുക്കുക!");
                return;
            }

            checkboxes.forEach(cb => {
                const index = cb.getAttribute('data-index');
                const student = studentData[index];
                const phone = student['Mobile (F)']; 
                if (phone) {
                    let breakdown = '';
                    if(student['Monthly Fee']) breakdown += `Monthly Fee: ₹${student['Monthly Fee']}\n`;
                    if(student['Exam Fee']) breakdown += `Exam Fee: ₹${student['Exam Fee']}\n`;
                    if(student['Medical']) breakdown += `Medical: ₹${student['Medical']}\n`;
                    if(student['Mess Fee']) breakdown += `Mess Fee: ₹${student['Mess Fee']}\n`;
                    if(student['Stationary']) breakdown += `Stationary: ₹${student['Stationary']}\n`;
                    if(student['Others']) breakdown += `Others: ₹${student['Others']}\n`;

                    const message = `പ്രിയപ്പെട്ട ${student['Father'] || ''},\nനിങ്ങളുടെ മകൾ ${student['Class'] || ''} ${student['Ad No'] || ''} ${student['Name']} എന്ന വിദ്യാർത്ഥിനിയുടെ OCTOBER മാസത്തിലെത് ഉൾപ്പെടെ Course fee താഴെ പറയുന്നവയാണ്:\n\n${breakdown}\nആകെ അടക്കേണ്ട തുക (Total): ₹${student['Total']}\n\nഈ തുക 05/10/2026-ന് മുമ്പ് അടച്ചു തീർക്കേണ്ടതാണ്.\n\nഫീ ഓഫീസിൽ നേരിട്ട് എത്തിക്കുകയോ താഴെ നൽകിയിരിക്കുന്ന അക്കൗണ്ടിലേക്ക് അയച്ച് സ്ക്രീൻ ഷോട്ട് /റസിപ്പറ്റി ന്റെ ഫോട്ടോ കുട്ടിയുടെ പേര്,ക്ലാസ്സ്‌ എന്നിവ 9447810041 എന്ന വാട്സാപ്പ് നമ്പറിലേക്ക് അയക്കുകയോ ചെയ്യുക\n(Transaction ID യും തിയ്യതിയും കാണുന്ന രീതിയിൽ അയക്കാൻ ശ്രദ്ധിക്കുക.)\n\nAc No: 16470200012711\nName: Crescent SNEC She Campus \nFederal Bank of India\nChelari\nIFSC : FDRL0001647`;
                    
                    messagesQueue.push({phone, message, checkbox: cb, studentName: student['Name']});
                }
            });

            if(messagesQueue.length > 0) {
                processQueue();
            }
        }

        function processQueue() {
            document.getElementById('messageOverlay').style.display = 'none';

             if (messagesQueue.length > 0) {
                const nextMessage = messagesQueue.shift(); 
                const whatsappUrl = `https://web.whatsapp.com/send?phone=91${nextMessage.phone}&text=${encodeURIComponent(nextMessage.message)}`;
                
                // വാട്സാപ്പ് തുറക്കുന്നു
                window.open(whatsappUrl, '_blank');
                nextMessage.checkbox.checked = false; 

                // പെട്ടെന്ന് തന്നെ പോപ്പ്-അപ്പ് വരാൻ 500ms സമയം മാത്രം
                if (messagesQueue.length > 0) {
                    document.getElementById('popupText').innerHTML = `അടുത്ത മെസ്സേജ് അയക്കേണ്ടത്: <br><strong style="font-size:18px; color:#d9534f;">${messagesQueue[0].studentName}</strong>`;
                    setTimeout(() => {
                        document.getElementById('messageOverlay').style.display = 'flex';
                    }, 500);
                } else {
                    setTimeout(() => {
                        document.getElementById('messageOverlay').style.display = 'flex';
                        document.getElementById('popupTitle').innerText = 'പൂർത്തിയായി';
                        document.getElementById('popupText').innerText = 'എല്ലാ മെസ്സേജുകളും അയച്ചു കഴിഞ്ഞു!';
                        document.querySelector('.btn-next').style.display = 'none';
                        document.querySelector('.btn-cancel').innerText = 'Close';
                    }, 500);
                }
            }
        }

        function cancelSending() {
            messagesQueue = [];
            document.getElementById('messageOverlay').style.display = 'none';
            document.querySelector('.btn-next').style.display = 'inline-block';
            document.querySelector('.btn-cancel').innerText = 'Cancel';
            document.getElementById('popupTitle').innerText = 'അടുത്ത മെസ്സേജ് തയ്യാറാണ്';
        }

        function handleFileUpload() {
            const fileInput = document.getElementById('excelFile');
            const file = fileInput.files[0];
            if (!file) { alert("ഫയൽ തിരഞ്ഞെടുക്കുക."); return; }

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet, {header: 1});
                
                if(jsonData.length > 0) {
                    document.getElementById('tableBody').innerHTML = '<tr><td colspan="11" style="text-align:center;">Uploading...</td></tr>';
                    fetch(webAppUrl, {
                        method: 'POST', mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: "upload", sheetData: jsonData })
                    }).then(() => {
                        alert("Uploaded successfully!"); fetchData(); 
                    }).catch(err => { alert("Error uploading."); });
                }
            };
            reader.readAsArrayBuffer(file);
        }

        async function archiveData() {
            if(confirm("പഴയ ഡാറ്റ Archive ചെയ്യണോ?")) {
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="11" style="text-align:center;">Archiving...</td></tr>';
                try {
                    await fetch(webAppUrl + "?action=archive");
                    alert("Archived successfully."); fetchData(); 
                } catch(error) { alert("Error."); fetchData(); }
            }
        }
        fetchData();
    </script>
</body>
</html>
